<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Connexion — Livraison</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f7fb; color: #162033; font-family: Inter, system-ui, sans-serif; }
      .card { width: min(420px, calc(100% - 36px)); padding: 28px; background: white; border-radius: 16px; box-shadow: 0 8px 28px #193b6514; }
      h1 { margin-top: 0; font-size: 24px; } label { display: block; margin: 14px 0 6px; font-size: 13px; font-weight: 700; }
      input { width: 100%; padding: 11px; border: 1px solid #ccd5e2; border-radius: 8px; font: inherit; }
      button { width: 100%; margin-top: 20px; padding: 12px; border: 0; border-radius: 8px; background: #123b70; color: white; font-weight: 700; cursor: pointer; }
    </style>
  </head>
  <body><main class="card">
    <h1>Administration livraison</h1>
    <form method="post" action="/admin/login">
      <label>Adresse e-mail</label>
      <input type="email" name="user" required autocomplete="username" />
      <label>Mot de passe</label>
      <input type="password" name="password" required autocomplete="current-password" />
      <button type="submit">Se connecter</button>
    </form>
  </main></body>
</html>
