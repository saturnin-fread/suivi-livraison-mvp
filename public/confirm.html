<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Confirmez votre livraison</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.png" sizes="64x64" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="stylesheet" href="/vendor/leaflet/leaflet.css" />
    <link rel="stylesheet" href="/client.css" />
    <style>
      .cf-in { animation: cf-in .5s both; animation-delay: calc(var(--i, 0) * 90ms); }
      @keyframes cf-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
      .cf-lock { max-width: 520px; padding: 28px; background: var(--surface); border: 1px solid var(--line); border-radius: 4px; }
      .cf-lock h2 { margin: 0; font-size: 24px; font-weight: 600; letter-spacing: -.02em; }
      .cf-lock p { margin: 10px 0 0; color: var(--muted); }
      .cf-lock-ic { width: 46px; height: 46px; display: grid; place-items: center; margin-bottom: 18px; border-radius: 50%; background: var(--green-soft); color: var(--green); }
      .cf-lock-ic svg.ic { width: 22px; height: 22px; }
      .cf-otp { display: flex; gap: 12px; margin: 24px 0 8px; }
      .cf-otp input { width: 58px; height: 64px; padding: 0; border: 1px solid var(--line-strong); border-radius: 4px; background: #fff; text-align: center; font-size: 26px; font-variant-numeric: tabular-nums; transition: border-color .15s, box-shadow .15s, transform .15s; }
      .cf-otp input:focus { outline: none; border-color: var(--green); box-shadow: 0 0 0 3px rgba(31, 84, 70, .14); }
      .cf-otp input.filled { border-color: var(--green); }
      .cf-otp.err input { border-color: var(--red); animation: cf-shake .35s; }
      @keyframes cf-shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
      .cf-choices { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
      .cf-choice { position: relative; display: block; cursor: pointer; }
      .cf-choice input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
      .cf-choice-body { display: block; height: 100%; padding: 18px 18px 16px; border: 1px solid var(--line-strong); border-radius: 4px; background: var(--surface); transition: border-color .2s, box-shadow .2s, transform .2s; }
      .cf-choice:hover .cf-choice-body { transform: translateY(-1px); border-color: #b9b9b1; }
      .cf-choice input:checked + .cf-choice-body { border-color: var(--green); box-shadow: 0 0 0 3px rgba(31, 84, 70, .12); }
      .cf-choice input:focus-visible + .cf-choice-body { outline: 3px solid rgba(31, 84, 70, .35); outline-offset: 2px; }
      .cf-choice-ic { width: 38px; height: 38px; display: grid; place-items: center; margin-bottom: 12px; border-radius: 50%; background: var(--green-soft); color: var(--green); }
      .cf-choice-ic svg.ic { width: 19px; height: 19px; }
      .cf-choice strong { display: block; font-size: 16px; font-weight: 600; }
      .cf-choice ul { margin: 8px 0 0; padding: 0; list-style: none; color: var(--muted); font-size: 14px; }
      .cf-choice li { display: flex; gap: 8px; margin-top: 4px; }
      .cf-choice li svg.ic { width: 15px; height: 15px; margin-top: 2px; color: var(--green); flex: 0 0 auto; }
      .cf-gps { display: grid; grid-template-rows: 0fr; opacity: 0; transition: grid-template-rows .4s cubic-bezier(.2, .8, .2, 1), opacity .3s; }
      .cf-gps > div { min-height: 0; overflow: hidden; }
      .cf-gps.open { grid-template-rows: 1fr; opacity: 1; margin-top: 16px; }
      .cf-summary { margin: 26px 0 0; padding: 0; list-style: none; }
      .cf-summary li { display: flex; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); color: var(--ink-2); font-size: 15px; }
      .cf-summary li:first-child { border-top: 0; }
      .cf-summary li svg.ic { width: 17px; height: 17px; margin-top: 2px; color: var(--green); flex: 0 0 auto; }
      @media (max-width: 720px) { .cf-choices { grid-template-columns: 1fr; } .cf-otp input { width: 52px; height: 58px; } }
      @media (prefers-reduced-motion: reduce) { .cf-in, .cf-otp.err input { animation: none; } .cf-gps, .cf-choice-body { transition: none; } }
    </style>
  </head>
  <body>
    <div class="cl-wrap">
      <header class="cl-head" id="head"></header>
      <main class="cl-main">
        <div class="cl-grid">
          <aside class="cl-aside">
            <p class="cl-eyebrow" id="eyebrow">&nbsp;</p>
            <h1 class="cl-title">Confirmez votre livraison</h1>
            <p class="cl-lead">Vérifiez vos informations, puis choisissez si vous partagez votre position.</p>
            <hr class="cl-rule" />
            <ul class="cf-summary">
              <li><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="16" r="1"/><rect x="3" y="10" width="18" height="12" rx="2"/><path d="M7 10V7a5 5 0 0 1 10 0v3"/></svg><span>Vos informations ne s’affichent que sur ce téléphone.</span></li>
              <li><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><span>Aucun compte ni application à installer.</span></li>
              <li><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></svg><span>Partager votre position reste un choix.</span></li>
            </ul>
          </aside>
          <div id="view"><div class="cl-skeleton"></div><div class="cl-skeleton"></div></div>
        </div>
      </main>
    </div>
    <script src="/vendor/leaflet/leaflet.js"></script>
    <script src="/map-base.js"></script>
    <script src="/client.js"></script>
    <script>
      (() => {
        const C = window.TraxoClient;
        const { esc, icon } = C;
        const token = C.requestTokenFromPath();
        const api = `/api/public/requests/${encodeURIComponent(token)}`;
        const view = document.getElementById('view');
        let company = '';

        const simple = (title, text) => {
          view.innerHTML = `<div class="cf-lock cf-in"><div class="cf-lock-ic">${icon('lock')}</div><h2>${esc(title)}</h2><p>${text}</p></div>`;
        };

        function renderGate(data) {
          if (data.locked) {
            simple('Ce lien est bloqué', `Trop d’essais ont été faits avec ce lien. Pour votre sécurité, contactez ${esc(company || 'l’entreprise')} pour en recevoir un nouveau.`);
            return;
          }
          view.innerHTML = `<form class="cf-lock cf-in" id="gate" novalidate>
            <div class="cf-lock-ic">${icon('lock')}</div>
            <h2>Protégeons vos informations</h2>
            <p>Saisissez les <strong>4 derniers chiffres</strong> du numéro de téléphone sur lequel vous avez reçu ce lien.</p>
            <div class="cf-otp" id="otp" role="group" aria-label="4 derniers chiffres de votre numéro">
              ${[0, 1, 2, 3].map((i) => `<input inputmode="numeric" maxlength="1" autocomplete="off" aria-label="Chiffre ${i + 1}" />`).join('')}
            </div>
            <p class="cl-hint" id="gateHint" aria-live="polite">${data.attemptsLeft < 5 ? `${data.attemptsLeft} essai${data.attemptsLeft > 1 ? 's' : ''} restant${data.attemptsLeft > 1 ? 's' : ''}.` : 'Cette vérification protège vos informations si le lien est transféré à quelqu’un d’autre.'}</p>
            <button class="cl-btn block" id="gateBtn" type="submit" style="margin-top:18px" disabled>Afficher mes informations</button>
          </form>`;
          const boxes = [...view.querySelectorAll('#otp input')];
          const value = () => boxes.map((b) => b.value).join('');
          const sync = () => {
            boxes.forEach((b) => b.classList.toggle('filled', Boolean(b.value)));
            view.querySelector('#otp').classList.remove('err');
            view.querySelector('#gateBtn').disabled = value().length !== 4;
          };
          boxes.forEach((box, i) => {
            box.addEventListener('input', () => {
              const digits = box.value.replace(/\D/g, '');
              box.value = '';
              digits.split('').slice(0, 4 - i).forEach((d, k) => { boxes[i + k].value = d; });
              (boxes[Math.min(i + digits.length, 3)] || box).focus();
              sync();
              if (value().length === 4) view.querySelector('#gate').requestSubmit();
            });
            box.addEventListener('keydown', (e) => {
              if (e.key === 'Backspace' && !box.value && i > 0) { boxes[i - 1].value = ''; boxes[i - 1].focus(); sync(); e.preventDefault(); }
            });
            box.addEventListener('paste', (e) => {
              const digits = (e.clipboardData.getData('text') || '').replace(/\D/g, '').slice(-4);
              if (!digits) return;
              e.preventDefault();
              digits.split('').forEach((d, k) => { if (boxes[k]) boxes[k].value = d; });
              sync();
              if (value().length === 4) view.querySelector('#gate').requestSubmit();
            });
          });
          boxes[0].focus();
          view.querySelector('#gate').addEventListener('submit', async (event) => {
            event.preventDefault();
            const button = view.querySelector('#gateBtn');
            button.disabled = true;
            button.textContent = 'Vérification…';
            const result = await C.fetchJson(`${api}/unlock`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ code: value() }) })
              .catch(() => ({ ok: false, data: { error: 'Connexion impossible. Vérifiez votre réseau.' } }));
            if (result.ok) { load(); return; }
            if (result.data.locked) { renderGate({ locked: true }); return; }
            button.textContent = 'Afficher mes informations';
            boxes.forEach((b) => { b.value = ''; });
            sync();
            view.querySelector('#otp').classList.add('err');
            const left = result.data.attemptsLeft;
            view.querySelector('#gateHint').textContent = `${result.data.error || 'Vérification impossible.'}${left != null ? ` ${left} essai${left > 1 ? 's' : ''} restant${left > 1 ? 's' : ''}.` : ''}`;
            view.querySelector('#gateHint').classList.add('err');
            boxes[0].focus();
          });
        }

        function renderForm(d) {
          const v = (key) => esc(d[key] || '');
          view.innerHTML = `<div id="msg" role="alert"></div>
            <form id="form" novalidate>
              <section class="cl-sec cf-in" style="--i:0">
                <div class="cl-sec-head"><span class="cl-sec-num">01</span><h2 class="cl-sec-title">Vos coordonnées</h2></div>
                <div class="cl-row">
                  <div class="cl-field"><label for="f-name">Nom et prénom *</label><input class="cl-input" id="f-name" name="customerName" autocomplete="name" required value="${v('customer_name')}" /></div>
                  <div class="cl-field"><label for="f-phone">Téléphone *</label>${C.phoneFieldHtml(d)}<p class="cl-hint" id="phoneHint">Pour vous joindre à l’arrivée.</p></div>
                </div>
              </section>
              <section class="cl-sec cf-in" style="--i:1">
                <div class="cl-sec-head"><span class="cl-sec-num">02</span><h2 class="cl-sec-title">Lieu de livraison</h2></div>
                <p class="cl-sec-sub">Corrigez ce qui n’est pas exact.</p>
                <div class="cl-field"><label for="f-zone">Quartier ou zone *</label><input class="cl-input" id="f-zone" name="neighborhood" required value="${v('neighborhood')}" /></div>
                <div class="cl-field"><label for="f-landmark">Repère <em>(facultatif)</em></label><input class="cl-input" id="f-landmark" name="landmark" placeholder="Ex. portail vert, près de la pharmacie" value="${v('landmark')}" /></div>
                <div class="cl-row">
                  <div class="cl-field"><label for="f-time">Créneau souhaité <em>(facultatif)</em></label><input class="cl-input" id="f-time" name="requestedTime" placeholder="Ex. 15 h – 17 h" value="${v('requested_time')}" /></div>
                  <div class="cl-field"><label for="f-notes">Consigne pour le livreur <em>(facultatif)</em></label><input class="cl-input" id="f-notes" name="notes" placeholder="Ex. appelez en arrivant" value="${v('notes')}" /></div>
                </div>
              </section>
              <section class="cl-sec cf-in" style="--i:2">
                <div class="cl-sec-head"><span class="cl-sec-num">03</span><h2 class="cl-sec-title">Votre position</h2></div>
                <div class="cf-choices" role="radiogroup" aria-label="Partager votre position">
                  <label class="cf-choice"><input type="radio" name="share" value="yes" /><span class="cf-choice-body"><span class="cf-choice-ic">${icon('pin')}</span><strong>Partager ma position</strong>
                    <ul><li>${icon('check')}Le livreur vient droit à vous</li><li>${icon('check')}Vous voyez l’heure d’arrivée estimée</li></ul></span></label>
                  <label class="cf-choice"><input type="radio" name="share" value="no" /><span class="cf-choice-body"><span class="cf-choice-ic">${icon('bike')}</span><strong>Ne pas la partager</strong>
                    <ul><li>${icon('check')}Vous suivez votre livreur en direct</li><li>${icon('check')}Il vous appelle pour se repérer</li></ul></span></label>
                </div>
                <div class="cf-gps" id="gpsWrap"><div><div class="cl-field" id="gpsField" style="margin:0"></div></div></div>
              </section>
              <div class="cl-sec cf-in" style="--i:3">
                <button class="cl-btn block big" id="submit" type="submit" disabled><span>Confirmer ma livraison</span>${icon('arrowRight')}</button>
                <p class="cl-hint" id="submitHint">Choisissez si vous partagez votre position.</p>
              </div>
            </form>`;
          const form = view.querySelector('#form');
          const msg = view.querySelector('#msg');
          const say = (text) => { msg.innerHTML = text ? `<p class="cl-notice err">${esc(text)}</p>` : ''; };
          C.wirePhoneField(form);
          let gps = null;
          const choice = () => (form.querySelector('input[name="share"]:checked') || {}).value;
          const refresh = () => {
            const c = choice();
            const ready = c === 'no' || (c === 'yes' && gps && gps.get());
            view.querySelector('#submit').disabled = !ready;
            view.querySelector('#submitHint').textContent = !c ? 'Choisissez si vous partagez votre position.'
              : c === 'yes' && !ready ? 'Touchez « Partager ma position », puis vérifiez l’épingle.'
                : 'Vos informations restent visibles seulement sur ce téléphone.';
          };
          form.querySelectorAll('input[name="share"]').forEach((r) => r.addEventListener('change', () => {
            const yes = choice() === 'yes';
            view.querySelector('#gpsWrap').classList.toggle('open', yes);
            if (yes && !gps) gps = C.createGpsField(view.querySelector('#gpsField'), { onChange: refresh, handoff: true });
            refresh();
          }));
          form.addEventListener('submit', async (event) => {
            event.preventDefault();
            say('');
            const missing = C.firstMissing(form);
            if (missing) { say('Merci de remplir les champs obligatoires.'); missing.focus(); return; }
            const share = choice() === 'yes';
            const position = share && gps ? gps.get() : null;
            if (share && !position) { say('Votre position n’est pas encore prête.'); return; }
            const button = view.querySelector('#submit');
            button.disabled = true;
            button.querySelector('span').textContent = 'Confirmation…';
            const fields = C.readFields(form);
            delete fields.share;
            const payload = { ...fields, shareLocation: share, ...(position ? { locationLat: position.latitude, locationLng: position.longitude, locationAccuracy: position.accuracy } : {}) };
            const result = await C.fetchJson(`${api}/confirm`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) })
              .catch(() => ({ ok: false, data: { error: 'Connexion impossible. Vérifiez votre réseau et réessayez.' } }));
            if (!result.ok) {
              button.querySelector('span').textContent = 'Confirmer ma livraison';
              refresh();
              say(result.data.error || 'Une erreur est survenue.');
              if (result.data.field) C.markFieldError(form, result.data.field, result.data.error);
              return;
            }
            location.assign(result.data.redirect);
          });
          refresh();
        }

        async function load() {
          const result = await C.fetchJson(api).catch(() => ({ ok: false, data: {} }));
          const data = result.data || {};
          company = data.companyName || '';
          C.renderHeader(document.getElementById('head'), company, 'Livraison', data.companyLogoUrl);
          document.getElementById('eyebrow').textContent = company ? `Livraison préparée par ${company}` : 'Votre livraison';
          if (company) document.title = `Confirmez votre livraison — ${company}`;
          if (!result.ok) { simple('Lien introuvable', 'Ce lien est introuvable ou a expiré.'); return; }
          if (data.stage === 'expired') { simple('Ce lien a expiré', `Contactez ${esc(company || 'l’entreprise')} pour en recevoir un nouveau.`); return; }
          if (data.stage !== 'to_confirm') { location.replace(`/demande/${encodeURIComponent(token)}/confirmation`); return; }
          if (data.needsCode) renderGate(data); else renderForm(data);
        }
        load();
      })();
    </script>
  </body>
</html>
