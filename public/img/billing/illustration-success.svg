<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180" fill="none"><style>.check{stroke-dasharray:65;stroke-dashoffset:65;animation:draw .65s .15s ease-out forwards}.ring{transform-origin:center;animation:reveal .5s ease-out both}@keyframes draw{to{stroke-dashoffset:0}}@keyframes reveal{from{transform:scale(.86);opacity:0}to{transform:scale(1);opacity:1}}@media(prefers-reduced-motion:reduce){.check{animation:none;stroke-dashoffset:0}.ring{animation:none}}</style><circle cx="90" cy="90" r="76" stroke="#DCE5D5" stroke-width="1.5" stroke-dasharray="3 7"/><circle class="ring" cx="90" cy="90" r="57" fill="#EDF3E8"/><circle cx="151" cy="48" r="7" fill="#CBD9C0"/><circle cx="30" cy="137" r="4" fill="#D92A41"/><path class="check" d="m65 91 17 17 34-36" stroke="#547E42" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg>
