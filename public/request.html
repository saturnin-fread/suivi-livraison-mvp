<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Préparer votre livraison</title>
    <link rel="stylesheet" href="/vendor/leaflet/leaflet.css" />
    <link rel="stylesheet" href="/client.css" />
  </head>
  <body>
    <div class="cl-wrap">
      <header class="cl-head" id="head"></header>
      <main class="cl-main">
        <div class="cl-grid">
          <aside class="cl-aside">
            <h1 class="cl-title">Préparer votre livraison</h1>
            <p class="cl-lead">Indiquez où notre livreur doit vous retrouver.</p>
            <hr class="cl-rule" />
            <p class="cl-strong" id="asideCompany">&nbsp;</p>
            <p class="cl-note">Vos informations restent modifiables jusqu’à la validation de votre demande.</p>
            <p class="cl-small" style="margin-top:12px">Aucun compte nécessaire.</p>
          </aside>
          <div>
            <div id="formMessage" role="alert"></div>
            <form id="form" novalidate></form>
          </div>
        </div>
      </main>
    </div>
    <script src="/vendor/leaflet/leaflet.js"></script>
    <script src="/client.js"></script>
    <script>
      (() => {
        const C = window.TraxoClient;
        const token = C.requestTokenFromPath();
        const form = document.getElementById('form');
        const message = document.getElementById('formMessage');
        let gps = null;
        let photos = null;
        let sending = false;

        const say = (text, kind) => { message.innerHTML = text ? `<p class="cl-notice${kind ? ` ${kind}` : ''}">${C.esc(text)}</p>` : ''; };

        function refreshSubmit() {
          const button = document.getElementById('submitBtn');
          const ready = Boolean(gps && gps.get());
          button.disabled = sending || !ready;
          document.getElementById('submitHint').textContent = ready ? 'Vous pourrez encore modifier vos informations après l’envoi.' : 'Partagez votre position pour continuer.';
        }

        function render(companyName) {
          C.renderHeader(document.getElementById('head'), companyName, 'Livraison');
          document.getElementById('asideCompany').textContent = companyName || '';
          if (companyName) document.title = `Préparer votre livraison — ${companyName}`;
          form.innerHTML = `${C.requestFieldsHtml()}
            <div class="cl-sec">
              <button class="cl-btn block" id="submitBtn" type="submit" disabled>Envoyer ma demande</button>
              <p class="cl-hint" id="submitHint"></p>
            </div>`;
          C.wirePhoneField(form);
          gps = C.createGpsField(document.getElementById('gpsField'), { onChange: refreshSubmit });
          photos = C.createPhotoPicker(document.getElementById('photoField'), { max: 3, onError: (text) => say(text, 'err') });
          refreshSubmit();
        }

        form.addEventListener('submit', async (event) => {
          event.preventDefault();
          say('');
          const missing = C.firstMissing(form);
          if (missing) { say('Merci de remplir les champs obligatoires.', 'err'); missing.focus(); return; }
          const position = gps.get();
          if (!position) { say(gps.imprecise() ? 'Votre position est trop imprécise : placez l’épingle sur votre lieu de livraison.' : 'Partagez votre position GPS pour continuer.', 'err'); gps.focus(); return; }
          sending = true;
          refreshSubmit();
          const button = document.getElementById('submitBtn');
          button.textContent = 'Envoi en cours…';
          const payload = { ...C.readFields(form), locationLat: position.latitude, locationLng: position.longitude, locationAccuracy: position.accuracy };
          const result = await C.fetchJson(`/api/public/requests/${encodeURIComponent(token)}`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload),
          }).catch(() => ({ ok: false, data: { error: 'Connexion impossible. Vérifiez votre réseau et réessayez.' } }));
          if (!result.ok) {
            sending = false;
            button.textContent = 'Envoyer ma demande';
            refreshSubmit();
            say(result.data.error || 'Une erreur est survenue.', 'err');
            if (result.data.field) C.markFieldError(form, result.data.field, result.data.error);
            return;
          }
          // La demande est enregistrée : les photos suivent, une à une.
          const pending = photos.items();
          let failed = 0;
          for (let i = 0; i < pending.length; i += 1) {
            button.textContent = `Envoi des photos (${i + 1}/${pending.length})…`;
            try { await C.uploadPhoto(token, pending[i].blob); } catch (_) { failed += 1; }
          }
          const target = new URL(result.data.redirect, location.origin);
          if (failed) target.searchParams.set('photos', 'partiel');
          location.assign(target.pathname + target.search);
        });

        (async () => {
          const result = await C.fetchJson(`/api/public/requests/${encodeURIComponent(token)}`).catch(() => ({ ok: false, data: {} }));
          if (result.ok && result.data.stage && result.data.stage !== 'pending') {
            location.replace(`/demande/${encodeURIComponent(token)}/confirmation`);
            return;
          }
          render(result.ok ? result.data.companyName : '');
          if (!result.ok) say(result.data.error || 'Ce formulaire est introuvable ou a expiré.', 'err');
        })();
      })();
    </script>
  </body>
</html>
