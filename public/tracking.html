<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="referrer" content="origin" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Suivi de votre livraison</title>
    <link rel="stylesheet" href="/vendor/leaflet/leaflet.css" />
    <link rel="stylesheet" href="/client.css" />
    <style>
      html, body { height: 100%; }
      body.trk { display: flex; flex-direction: column; overflow: hidden; background: #eceee9; }
      .trk-head { position: relative; z-index: 900; flex: 0 0 auto; display: flex; align-items: center; gap: clamp(16px, 4vw, 64px); min-height: 76px; padding: env(safe-area-inset-top) var(--gutter) 0; background: var(--surface); border-bottom: 1px solid var(--line); }
      .trk-back { display: inline-flex; align-items: center; gap: 10px; color: var(--ink-2); font-size: 17px; text-decoration: none; white-space: nowrap; }
      .trk-back:hover { color: var(--green); }
      .trk-back svg.ic { width: 20px; height: 20px; stroke-width: 1.8; }
      .trk-num { position: absolute; left: 50%; transform: translateX(-50%); color: var(--ink-2); font-size: 16px; white-space: nowrap; }
      .trk-live { margin-left: auto; display: inline-flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 500; color: var(--green); white-space: nowrap; }
      .trk-live.grey { color: var(--muted); }
      .trk-live.red { color: var(--red); }
      .trk-live .cl-dot { width: 11px; height: 11px; }
      .trk-main { position: relative; flex: 1 1 auto; min-height: 0; }
      #map { position: absolute; inset: 0; background: #e9ebe6; }
      #map .leaflet-tile-pane { filter: saturate(.42) brightness(1.04) contrast(.94); }
      .leaflet-container { font-family: inherit; }

      /* Marqueurs */
      .trk-drv { position: relative; width: 46px; height: 46px; }
      .trk-drv-halo { position: absolute; inset: -22px; border-radius: 50%; background: rgba(31, 84, 70, .16); animation: trk-halo 2.6s ease-out infinite; }
      .trk-drv-dot { position: absolute; inset: 3px; display: grid; place-items: center; border-radius: 50%; background: var(--green); color: #fff; box-shadow: 0 0 0 3px #fff, 0 4px 14px rgba(0, 0, 0, .22); }
      .trk-drv-dot svg.ic { width: 21px; height: 21px; stroke-width: 1.9; }
      .trk-drv.stale .trk-drv-dot { background: #7c8580; }
      .trk-drv.stale .trk-drv-halo { display: none; }
      @keyframes trk-halo { 0% { transform: scale(.55); opacity: 1; } 100% { transform: scale(1); opacity: 0; } }
      .trk-dest { position: relative; width: 36px; height: 46px; }
      .trk-dest svg { width: 36px; height: 44px; filter: drop-shadow(0 3px 5px rgba(0, 0, 0, .25)); }
      .trk-dest::after { content: ""; position: absolute; left: 50%; bottom: -4px; width: 10px; height: 10px; margin-left: -5px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 2.5px #fff; }
      .leaflet-tooltip.trk-label { padding: 7px 12px; border: 0; border-radius: 4px; background: #fff; color: var(--ink); font-size: 14.5px; font-weight: 500; box-shadow: 0 2px 10px rgba(0, 0, 0, .14); white-space: nowrap; }
      .leaflet-tooltip.trk-label::before { display: none; }

      /* Panneau « Votre livraison » */
      .trk-panel { position: absolute; z-index: 800; left: clamp(16px, 2.5vw, 36px); bottom: clamp(16px, 5vh, 70px); width: min(482px, calc(100% - 32px)); max-height: calc(100% - 40px); display: flex; flex-direction: column; background: var(--surface); border-radius: 6px; box-shadow: 0 10px 40px rgba(20, 30, 25, .16), 0 1px 3px rgba(0, 0, 0, .08); overflow: hidden; }
      .trk-panel-top { padding: 22px 22px 0; }
      .trk-panel-toggle { display: flex; align-items: center; justify-content: space-between; width: 100%; padding: 0; border: 0; background: none; font-size: 17px; font-weight: 500; color: var(--ink); cursor: pointer; text-align: left; }
      .trk-panel-toggle svg.ic { transition: transform .2s; }
      .trk-panel.collapsed .trk-panel-toggle svg.ic { transform: rotate(180deg); }
      .trk-status { display: flex; align-items: center; gap: 16px; margin: 16px 0 0; padding-bottom: 18px; border-bottom: 1px solid var(--line); font-size: 24px; font-weight: 600; letter-spacing: -0.02em; }
      .trk-status .cl-dot { width: 20px; height: 20px; }
      .trk-panel-body { padding: 0 22px; overflow-y: auto; overscroll-behavior: contain; }
      .trk-panel.collapsed .trk-panel-body, .trk-panel.collapsed .trk-panel-foot { display: none; }
      .trk-panel.collapsed .trk-status { border-bottom: 0; }
      .trk-driver { display: flex; align-items: center; gap: 18px; padding: 16px 0; border-bottom: 1px solid var(--line); }
      .trk-driver .cl-avatar { width: 54px; height: 54px; font-size: 19px; }
      .trk-driver-name { display: block; font-size: 17.5px; font-weight: 500; }
      .trk-driver-sub { display: block; color: var(--muted); }
      .trk-driver small { display: block; margin-top: 6px; color: var(--muted); font-size: 14px; }
      .trk-steps { padding: 20px 0 22px; border-bottom: 1px solid var(--line); }
      .trk-steps .cl-step { padding-bottom: 16px; grid-template-columns: 28px 1fr auto; gap: 0 18px; }
      .trk-steps .cl-step:not(:last-child)::before { left: 13.5px; top: 30px; bottom: 0; }
      .trk-steps .cl-step-ic { width: 28px; height: 28px; }
      .trk-steps .cl-step-body strong { font-size: 16.5px; margin-top: 3px; }
      .trk-steps .cl-step.current.green .cl-step-ic { width: 22px; height: 22px; margin: 3px; }
      .trk-steps .cl-step.upcoming .cl-step-ic { width: 22px; height: 22px; margin: 3px; border-width: 2px; }
      .trk-steps .cl-step.upcoming .cl-step-body strong { color: var(--muted); }
      .trk-msg { margin: 14px 0 0; color: var(--muted); font-size: 14.5px; }
      .trk-panel-foot { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; padding: 18px 22px 20px; font-size: 15.5px; }
      .trk-dest-line { display: inline-flex; align-items: center; gap: 10px; min-width: 0; }
      .trk-dest-line svg.ic { color: var(--ink); fill: var(--ink); stroke: var(--ink); width: 18px; height: 18px; }
      .trk-dest-line svg.ic circle { fill: #fff; }

      /* Contrôles de carte */
      .trk-ctrl { position: absolute; z-index: 800; right: clamp(16px, 2vw, 30px); bottom: clamp(40px, 9vh, 100px); display: flex; flex-direction: column; align-items: flex-end; gap: 36px; }
      .trk-zoom { display: flex; flex-direction: column; background: var(--surface); border-radius: 5px; box-shadow: 0 2px 10px rgba(0, 0, 0, .14); overflow: hidden; }
      .trk-zoom button { width: 46px; height: 46px; display: grid; place-items: center; border: 0; background: none; color: var(--ink); cursor: pointer; }
      .trk-zoom button + button { border-top: 1px solid var(--line); }
      .trk-zoom button:hover, .trk-recenter:hover { background: #f3f4f1; }
      .trk-recenter { display: inline-flex; align-items: center; gap: 10px; min-height: 46px; padding: 0 18px; border: 0; border-radius: 5px; background: var(--surface); color: var(--ink); font-size: 14.5px; font-weight: 500; box-shadow: 0 2px 10px rgba(0, 0, 0, .14); cursor: pointer; }
      .trk-recenter:disabled { color: #a0a09a; cursor: default; }
      .trk-zoom button:focus-visible, .trk-recenter:focus-visible, .trk-panel-toggle:focus-visible, .trk-back:focus-visible { outline: 3px solid rgba(31, 84, 70, .4); outline-offset: 2px; }
      .leaflet-control-attribution { font-size: 10.5px; }

      /* Livraison terminée : plus de carte (aucune position exposée) */
      body.trk-done .trk-main { overflow-y: auto; padding: clamp(24px, 6vh, 64px) 16px; }
      body.trk-done #map, body.trk-done .trk-ctrl { display: none; }
      body.trk-done .trk-panel { position: relative; left: auto; bottom: auto; margin: 0 auto; max-height: none; }
      .trk-fallback { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; color: var(--muted); text-align: center; }

      @media (max-width: 900px) {
        .trk-num { position: static; transform: none; }
      }
      @media (max-width: 640px) {
        .trk-head { min-height: 60px; gap: 12px; }
        .trk-head .cl-brand-name, .trk-back span, .trk-live span.txt { display: none; }
        .trk-num { font-size: 15px; }
        .trk-panel { left: 0; right: 0; bottom: 0; width: 100%; max-height: 52%; border-radius: 14px 14px 0 0; padding-bottom: env(safe-area-inset-bottom); }
        .trk-panel-top { padding: 18px 18px 0; }
        .trk-panel-body { padding: 0 18px; }
        .trk-panel-foot { padding: 14px 18px 16px; }
        .trk-status { font-size: 21px; margin-top: 12px; padding-bottom: 14px; }
        .trk-driver { padding: 12px 0; }
        .trk-steps { padding: 14px 0 16px; }
        .trk-steps .cl-step { padding-bottom: 10px; }
        .trk-ctrl { top: 12px; bottom: auto; right: 12px; gap: 8px; flex-direction: row; align-items: center; }
        .trk-zoom { flex-direction: row; }
        .trk-zoom button { width: 42px; height: 42px; }
        .trk-zoom button + button { border-top: 0; border-left: 1px solid var(--line); }
        .trk-recenter { padding: 0 13px; min-height: 42px; }
        .trk-recenter span { display: none; }
        body.trk-done .trk-panel { border-radius: 8px; }
      }
      @media (prefers-reduced-motion: reduce) { .trk-drv-halo { animation: none; opacity: .6; transform: scale(.8); } }
    </style>
  </head>
  <body class="trk">
    <header class="trk-head" id="head">
      <div class="cl-brand" id="brand"><span class="cl-brand-mark" aria-hidden="true">·</span><span class="cl-brand-name"></span></div>
      <a class="trk-back" id="backLink" href="#" hidden><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg><span>Ma livraison</span></a>
      <span class="trk-num" id="orderNumber">Livraison</span>
      <span class="trk-live grey" id="live" role="status" aria-live="polite"><span class="cl-dot grey" aria-hidden="true"></span><span class="txt">Connexion…</span></span>
    </header>
    <main class="trk-main" id="trackingContent">
      <div id="map" role="region" aria-label="Carte montrant la position de votre livreur et votre destination"></div>
      <p class="trk-fallback" id="mapFallback" hidden>La carte ne peut pas être chargée pour le moment.</p>
      <section class="trk-panel" id="panel" aria-labelledby="panelTitle">
        <div class="trk-panel-top">
          <button class="trk-panel-toggle" id="panelToggle" type="button" aria-expanded="true" aria-controls="panelBody"><span id="panelTitle">Votre livraison</span><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
          <div class="trk-status" aria-live="polite"><span class="cl-dot green" id="statusDot" aria-hidden="true"></span><span id="statusText">Chargement…</span></div>
        </div>
        <div class="trk-panel-body" id="panelBody">
          <div class="trk-driver" id="driverCard" hidden></div>
          <ol class="cl-steps trk-steps" id="steps" aria-label="Étapes de la livraison"></ol>
          <p class="trk-msg" id="message" hidden></p>
        </div>
        <div class="trk-panel-foot">
          <span class="trk-dest-line"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></svg><span id="destLabel">Destination</span></span>
          <a class="cl-link" id="infoLink" href="#" hidden>Voir les informations <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></a>
        </div>
      </section>
      <div class="trk-ctrl" id="mapControls">
        <div class="trk-zoom"><button type="button" id="zoomIn" aria-label="Zoomer"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg></button><button type="button" id="zoomOut" aria-label="Dézoomer"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></button></div>
        <button type="button" class="trk-recenter" id="recenter" disabled><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><line x1="2" x2="5" y1="12" y2="12"/><line x1="19" x2="22" y1="12" y2="12"/><line x1="12" x2="12" y1="2" y2="5"/><line x1="12" x2="12" y1="19" y2="22"/><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="3"/></svg><span>Recentrer</span></button>
      </div>
    </main>
    <script src="/vendor/leaflet/leaflet.js"></script>
    <script src="/client.js"></script>
    <script>
      (() => {
        const C = window.TraxoClient;
        const REFRESH_INTERVAL_MS = 10000;
        const STALE_AFTER_MS = 10 * 60 * 1000;
        const ORDER_FLOW = ['Confirmée', 'En préparation', 'Récupérée', 'En tournée', 'En livraison', 'Arrivée', 'Livrée'];
        const STATUS_TEXT = {
          'Confirmée': 'Commande validée', 'En préparation': 'Commande en préparation', 'Récupérée': 'Colis récupéré',
          'En tournée': 'Votre livreur est en tournée', 'En livraison': 'En route vers vous', 'Arrivée': 'Votre livreur est arrivé',
          'Livrée': 'Livraison terminée', 'Retournée': 'Livraison retournée', 'Annulée': 'Livraison annulée',
        };
        const token = location.pathname.split('/').filter(Boolean).pop() || '';
        const $ = (id) => document.getElementById(id);
        const el = {
          brand: $('brand'), back: $('backLink'), number: $('orderNumber'), live: $('live'), panel: $('panel'),
          toggle: $('panelToggle'), statusDot: $('statusDot'), statusText: $('statusText'), driver: $('driverCard'),
          steps: $('steps'), message: $('message'), destLabel: $('destLabel'), info: $('infoLink'),
          recenter: $('recenter'), map: $('map'), fallback: $('mapFallback'),
        };

        let map = null;
        let tileLayer = null;
        let mapConfigSignature = '';
        let driverMarker = null;
        let destinationMarker = null;
        let routeLine = null;
        let driverPosition = null;
        let destinationPosition = null;
        let framed = false;
        let refreshInFlight = false;
        let refreshTimer = null;
        let refreshPausedUntil = 0;
        let terminal = false;

        // Retour vers la page de demande, uniquement si on vient d'elle (même onglet).
        let backPath = null;
        try { backPath = sessionStorage.getItem(`traxo.back:${location.pathname}`); } catch (_) { backPath = null; }
        if (backPath && /^\/demande\/[A-Za-z0-9_-]+\/confirmation$/.test(backPath)) {
          el.back.href = backPath; el.back.hidden = false;
          el.info.href = backPath; el.info.hidden = false;
        }

        try { if (sessionStorage.getItem('traxo.panel') === 'collapsed') setCollapsed(true); } catch (_) { /* rien */ }
        function setCollapsed(collapsed) {
          el.panel.classList.toggle('collapsed', collapsed);
          el.toggle.setAttribute('aria-expanded', String(!collapsed));
          try { sessionStorage.setItem('traxo.panel', collapsed ? 'collapsed' : 'open'); } catch (_) { /* rien */ }
        }
        el.toggle.addEventListener('click', () => setCollapsed(!el.panel.classList.contains('collapsed')));

        function setLive(text, tone, pulse) {
          el.live.className = `trk-live ${tone || ''}`.trim();
          el.live.innerHTML = `<span class="cl-dot ${tone === 'grey' ? 'grey' : tone === 'red' ? 'red' : 'green'}${pulse ? ' live' : ''}" aria-hidden="true"></span><span class="txt">${C.esc(text)}</span>`;
          el.live.setAttribute('aria-label', text);
        }

        function validCoordinate(latitude, longitude) {
          return Number.isFinite(latitude) && Number.isFinite(longitude) && latitude >= -90 && latitude <= 90 && longitude >= -180 && longitude <= 180;
        }
        const num = (value) => (value === null || value === undefined || value === '' ? Number.NaN : Number(value));

        function renderHeader(data) {
          const name = String(data.companyName || '').trim();
          if (name) {
            el.brand.innerHTML = `<span class="cl-brand-mark" aria-hidden="true">${C.esc(name[0].toUpperCase())}</span><span class="cl-brand-name">${C.esc(name)}</span>`;
            document.title = `Suivi de votre livraison — ${name}`;
          }
          if (data.displayNumber) el.number.textContent = `Livraison #${data.displayNumber}`;
        }

        function renderSteps(data) {
          const status = data.orderStatus;
          const index = ORDER_FLOW.indexOf(status);
          const s = data.steps || {};
          const delivered = status === 'Livrée';
          const done = [true, index >= 2 || Boolean(s.pickedUpAt), delivered, delivered];
          const closed = ['Retournée', 'Annulée'].includes(status);
          const currentIndex = closed || delivered ? -1 : done.indexOf(false);
          const rows = [
            ['Commande validée', s.validatedAt], ['Prise en charge', s.pickedUpAt],
            ['En route', s.enRouteAt], ['Livrée', s.deliveredAt],
          ];
          el.steps.innerHTML = rows.map(([label, at], i) => {
            const state = done[i] ? 'done' : i === currentIndex ? 'current green' : 'upcoming';
            const time = C.formatTime(at) || '—';
            return `<li class="cl-step ${state}"><span class="cl-step-ic">${done[i] ? C.icon('check') : ''}</span><div class="cl-step-body"><strong>${C.esc(label)}</strong></div><span class="cl-step-time">${C.esc(time)}</span></li>`;
          }).join('');
        }

        function renderPanel(data) {
          const closed = ['Retournée', 'Annulée'].includes(data.orderStatus);
          el.statusText.textContent = STATUS_TEXT[data.orderStatus] || 'Suivi de votre livraison';
          el.statusDot.className = `cl-dot ${closed ? 'grey' : 'green'}`;
          const driver = data.driver;
          if (driver) {
            const at = C.formatTime(data.timestamp);
            el.driver.innerHTML = `<span class="cl-avatar" aria-hidden="true">${C.esc(C.initials(driver.name))}</span><div><strong class="trk-driver-name">${C.esc(driver.name)}</strong><span class="trk-driver-sub">${C.esc(driver.vehicleType || '')}</span>${at && data.positionVisible !== false ? `<small>Dernière position reçue à ${C.esc(at)}</small>` : ''}</div>`;
            el.driver.hidden = false;
          } else el.driver.hidden = true;
          renderSteps(data);
          const place = String(data.neighborhood || '').trim();
          el.destLabel.textContent = place ? `Destination : ${place}` : 'Votre point de livraison';
          const note = data.status === 'completed' || data.status === 'online' ? '' : (data.message || '');
          el.message.textContent = note;
          el.message.hidden = !note;
        }

        // ---- Carte ----------------------------------------------------
        function validTileConfig(config) {
          return config && typeof config.url === 'string' && /^https:\/\//i.test(config.url)
            && Number.isInteger(Number(config.maxZoom)) && Number(config.maxZoom) >= 1 && Number(config.maxZoom) <= 24;
        }
        function applyMapConfig(config) {
          if (!map || !validTileConfig(config && config.base)) return;
          const signature = JSON.stringify(config.base);
          if (signature === mapConfigSignature) return;
          mapConfigSignature = signature;
          if (tileLayer) map.removeLayer(tileLayer);
          tileLayer = L.tileLayer(config.base.url, { maxZoom: Number(config.base.maxZoom), attribution: String(config.base.attribution || '') }).addTo(map);
        }

        function driverIcon(vehicleType, stale) {
          return L.divIcon({
            className: '', iconSize: [46, 46], iconAnchor: [23, 23],
            html: `<div class="trk-drv${stale ? ' stale' : ''}"><span class="trk-drv-halo"></span><span class="trk-drv-dot">${C.icon(C.isCar(vehicleType) ? 'car' : 'bike')}</span></div>`,
          });
        }
        const destinationIcon = typeof window.L !== 'undefined' ? L.divIcon({
          className: '', iconSize: [36, 46], iconAnchor: [18, 46],
          html: '<div class="trk-dest"><svg viewBox="0 0 36 44" aria-hidden="true"><path d="M18 1C9 1 2 8 2 16.5 2 28 18 43 18 43s16-15 16-26.5C34 8 27 1 18 1Z" fill="#1c2630"/><circle cx="18" cy="16" r="6" fill="#fff"/></svg></div>',
        }) : null;

        function renderDestination(destination) {
          const latitude = num(destination && destination.latitude);
          const longitude = num(destination && destination.longitude);
          if (!validCoordinate(latitude, longitude)) {
            if (destinationMarker) { map.removeLayer(destinationMarker); destinationMarker = null; }
            destinationPosition = null;
            return;
          }
          destinationPosition = [latitude, longitude];
          if (!destinationMarker) {
            destinationMarker = L.marker(destinationPosition, { icon: destinationIcon, keyboard: false, title: 'Votre destination' }).addTo(map)
              .bindTooltip('Votre destination', { permanent: true, direction: 'top', offset: [0, -50], className: 'trk-label' });
          } else destinationMarker.setLatLng(destinationPosition);
        }

        function renderDriver(data) {
          const latitude = num(data.latitude);
          const longitude = num(data.longitude);
          if (data.positionVisible === false || !validCoordinate(latitude, longitude)) {
            if (driverMarker) { map.removeLayer(driverMarker); driverMarker = null; }
            driverPosition = null;
            return;
          }
          driverPosition = [latitude, longitude];
          const timestamp = data.timestamp ? new Date(data.timestamp) : null;
          const age = timestamp && !Number.isNaN(timestamp.getTime()) ? Date.now() - timestamp.getTime() : Number.NaN;
          const stale = data.status === 'stale' || (Number.isFinite(age) && age > STALE_AFTER_MS);
          const firstName = String((data.driver && data.driver.name) || 'Livreur').split(/\s+/)[0];
          if (!driverMarker) {
            driverMarker = L.marker(driverPosition, { icon: driverIcon(data.driver && data.driver.vehicleType, stale), keyboard: false, zIndexOffset: 500, title: 'Votre livreur' }).addTo(map)
              .bindTooltip(`${C.esc(firstName)} · Votre livreur`, { permanent: true, direction: 'top', offset: [0, -30], className: 'trk-label' });
          } else {
            driverMarker.setLatLng(driverPosition);
            driverMarker.setIcon(driverIcon(data.driver && data.driver.vehicleType, stale));
          }
          if (stale) setLive('Position non actualisée', 'grey');
          else setLive('Suivi en direct', '', true);
        }

        function renderRoute(route) {
          const coordinates = route && Array.isArray(route.coordinates) ? route.coordinates : null;
          const latLngs = coordinates ? coordinates
            .map((point) => [Number(point[1]), Number(point[0])])
            .filter(([lat, lng]) => validCoordinate(lat, lng)) : [];
          if (latLngs.length < 2 || !driverPosition) {
            if (routeLine) { map.removeLayer(routeLine); routeLine = null; }
            return;
          }
          if (!routeLine) routeLine = L.polyline(latLngs, { color: '#1f5446', weight: 4, opacity: 0.92, lineJoin: 'round', lineCap: 'round', interactive: false }).addTo(map);
          else routeLine.setLatLngs(latLngs);
        }

        // Cadre la carte sur livreur + destination, en tenant compte du panneau.
        function frame(animate) {
          if (!map) return;
          const points = [driverPosition, destinationPosition].filter(Boolean);
          el.recenter.disabled = !points.length;
          if (!points.length) return;
          const mapRect = el.map.getBoundingClientRect();
          const panelRect = el.panel.getBoundingClientRect();
          const mobile = window.matchMedia('(max-width: 640px)').matches;
          const options = { maxZoom: 16, animate: Boolean(animate) };
          if (mobile) {
            // Marge à droite pour les boutons de carte, en haut pour les étiquettes.
            // Les étiquettes (~230 px) sont centrées sur les marqueurs : marge latérale en conséquence.
            options.paddingTopLeft = [120, 110];
            options.paddingBottomRight = [120, Math.max(40, mapRect.bottom - panelRect.top + 30)];
          } else {
            options.paddingTopLeft = [Math.min(panelRect.right - mapRect.left + 40, mapRect.width * 0.55), 70];
            options.paddingBottomRight = [110, 70];
          }
          if (points.length === 1) {
            map.fitBounds(L.latLngBounds([points[0], points[0]]), { ...options, maxZoom: 15 });
          } else map.fitBounds(L.latLngBounds(points), options);
        }

        function renderCompleted(data) {
          terminal = true;
          if (refreshTimer) window.clearInterval(refreshTimer);
          refreshTimer = null;
          if (map) { map.remove(); map = null; }
          document.body.classList.add('trk-done');
          setCollapsed(false);
          setLive(data.orderStatus === 'Livrée' ? 'Livraison terminée' : 'Suivi terminé', data.orderStatus === 'Livrée' ? '' : 'grey');
          renderPanel({ ...data, positionVisible: false });
          el.message.textContent = data.message || '';
          el.message.hidden = !data.message;
        }

        async function refresh() {
          if (refreshInFlight || terminal || document.hidden || Date.now() < refreshPausedUntil) return;
          refreshInFlight = true;
          const controller = new AbortController();
          const timeout = window.setTimeout(() => controller.abort(), 12000);
          try {
            const response = await fetch(`/api/tracking/${encodeURIComponent(token)}`, {
              cache: 'no-store', headers: { Accept: 'application/json' }, signal: controller.signal,
            });
            const data = await response.json().catch(() => ({}));
            if ([429, 503].includes(response.status)) {
              const retryAfterSeconds = Number(response.headers.get('Retry-After'));
              if (Number.isFinite(retryAfterSeconds) && retryAfterSeconds > 0) refreshPausedUntil = Date.now() + (retryAfterSeconds * 1000);
            }
            if (!response.ok) throw new Error(data.error || 'Le suivi est temporairement indisponible.');
            renderHeader(data);
            if (data.status === 'completed') { renderCompleted(data); return; }
            renderPanel(data);
            if (!map) return;
            applyMapConfig(data.mapConfig);
            renderDestination(data.destination);
            renderDriver(data);
            renderRoute(data.route);
            if (data.positionVisible === false) setLive('Suivi pas encore démarré', 'grey');
            else if (!driverPosition) setLive('Position indisponible', 'grey');
            if (!framed && (driverPosition || destinationPosition)) { frame(false); framed = true; }
            el.recenter.disabled = !(driverPosition || destinationPosition);
          } catch (error) {
            const text = error.name === 'AbortError' ? 'Connexion lente…' : 'Connexion perdue';
            setLive(text, 'red');
            if (!driverPosition) {
              el.statusText.textContent = error.name === 'AbortError' ? 'Mise à jour en cours…' : (error.message || 'Suivi indisponible');
            }
          } finally {
            window.clearTimeout(timeout);
            refreshInFlight = false;
          }
        }

        function initializeMap() {
          if (typeof window.L === 'undefined') {
            el.map.hidden = true;
            el.fallback.hidden = false;
            $('mapControls').hidden = true;
            return false;
          }
          const mobile = window.matchMedia('(max-width: 640px)').matches;
          map = L.map('map', { zoomControl: false, attributionControl: false, keyboard: true }).setView([6.37, 2.43], 13);
          L.control.attribution({ position: mobile ? 'topleft' : 'bottomright', prefix: '<a href="https://leafletjs.com/">Leaflet</a>' }).addTo(map);
          applyMapConfig({ base: { url: 'https://tile.openstreetmap.org/{z}/{x}/{y}.png', maxZoom: 19, attribution: '&copy; OpenStreetMap contributors' } });
          $('zoomIn').addEventListener('click', () => map && map.zoomIn());
          $('zoomOut').addEventListener('click', () => map && map.zoomOut());
          el.recenter.addEventListener('click', () => frame(true));
          return true;
        }

        document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
        if (!token) {
          el.statusText.textContent = 'Lien de suivi invalide.';
          setLive('Lien invalide', 'red');
        } else {
          initializeMap();
          refresh();
          refreshTimer = window.setInterval(refresh, REFRESH_INTERVAL_MS);
          window.addEventListener('pagehide', () => window.clearInterval(refreshTimer), { once: true });
        }
      })();
    </script>
  </body>
</html>
