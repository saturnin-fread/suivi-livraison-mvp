<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0d2e58" />
    <title>Mes livraisons — TRAXO</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.png" sizes="64x64" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="stylesheet" href="/app.css" />
    <link rel="stylesheet" href="/driver.css" />
    <link rel="stylesheet" href="/loaders.css" />
  </head>
  <body class="driver-body">
    <header class="driver-header">
      <div><strong id="driverName">Espace livreur</strong><small id="companyName">Chargement…</small></div>
      <form method="post" action="/app/logout"><button class="driver-logout">Quitter</button></form>
    </header>
    <aside class="driver-connectivity" id="driverConnectivity" hidden aria-live="polite">
      <div><strong id="connectivityTitle">Connexion disponible</strong><small id="connectivityDetail"></small></div>
      <button id="syncDriverActions" type="button">Synchroniser</button>
    </aside>
    <section class="driver-outbox" id="driverOutbox" hidden aria-live="polite"></section>
    <main class="driver-main" id="driverPage"><div class="card">Chargement…</div></main>
    <nav class="driver-nav" aria-label="Navigation livreur">
      <a href="/driver" id="activeLink">À livrer</a>
      <a href="/driver?scope=history" id="historyLink">Historique</a>
    </nav>
    <script src="/driver-queue.js" defer></script>
    <script src="/loaders.js" defer></script>
    <script src="/ui-kit.js" defer></script>
    <script src="/driver.js" defer></script>
  </body>
</html>
