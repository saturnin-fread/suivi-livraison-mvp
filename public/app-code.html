<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Vérification — TRAXO</title>
    <link rel="preload" href="/fonts/traxosans-700.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.png" sizes="64x64" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="stylesheet" href="/auth.css" />
    <link rel="stylesheet" href="/loaders.css" />
  </head>
  <body>
    <header class="ax-header">
      <a class="ax-logo" href="/app/login"><img src="/brand/traxo-logo.png" width="160" height="34" alt="TRAXO" /></a>
    </header>

    <main class="ax-center">
      <section class="ax-card" aria-labelledby="title">
        <div class="ax-badge" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4M12 15v2"/></svg>
        </div>
        <h1 class="ax-title" id="title">Vérification</h1>
        <p class="ax-sub" id="subtitle">Saisissez le code à 6 chiffres.</p>
        <p class="ax-target" id="target"></p>

        <div class="ax-banner error" id="banner" role="alert" hidden></div>

        <div class="ax-choose" id="chooser" hidden>
          <button type="button" class="ax-choice" data-channel="email">
            <span class="ax-choice-ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg></span>
            <span class="ax-choice-main"><strong>Par e‑mail</strong><small id="chooseEmail"></small></span>
            <span class="ax-choice-go" aria-hidden="true">→</span>
          </button>
          <button type="button" class="ax-choice" data-channel="whatsapp">
            <span class="ax-choice-ic wa" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21l1.7-5A8.5 8.5 0 1 1 8 19.4L3 21z"/><path d="M9 9.5c0 3 2.5 5.5 5.5 5.5l1.2-1.4-2-1-1 .8c-1-.5-1.6-1.1-2.1-2.1l.8-1-1-2L9 9.5z"/></svg></span>
            <span class="ax-choice-main"><strong>Sur WhatsApp</strong><small id="chooseWa"></small></span>
            <span class="ax-choice-go" aria-hidden="true">→</span>
          </button>
        </div>

        <form id="codeForm" method="post" action="/app/login/code" data-busy-form>
          <input type="hidden" name="code" id="codeValue" />
          <div class="ax-otp" id="otp" role="group" aria-label="Code à 6 chiffres">
            <input type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" aria-label="Chiffre 1" />
            <input type="text" inputmode="numeric" maxlength="6" aria-label="Chiffre 2" />
            <input type="text" inputmode="numeric" maxlength="6" aria-label="Chiffre 3" />
            <input type="text" inputmode="numeric" maxlength="6" aria-label="Chiffre 4" />
            <input type="text" inputmode="numeric" maxlength="6" aria-label="Chiffre 5" />
            <input type="text" inputmode="numeric" maxlength="6" aria-label="Chiffre 6" />
          </div>
          <div class="ax-recovery" id="recoveryWrap" hidden>
            <label class="ax-label" for="recoveryInput">Code de secours</label>
            <input class="ax-input" id="recoveryInput" type="text" autocomplete="off" maxlength="9" placeholder="ABCD-EFGH" />
          </div>
          <button class="ax-submit" type="submit" data-busy="Vérification…"><span class="ax-spin" aria-hidden="true"></span><span data-label>Vérifier le code</span></button>
        </form>

        <div class="ax-resend" id="resendBlock" hidden>
          <div id="resendWait">Vous pourrez demander un nouveau code dans <span class="ax-timer" id="timer">0:30</span></div>
          <button type="button" class="ax-link-btn" id="resendBtn" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36M21 4v5h-5"/></svg>
            Renvoyer le code
          </button>
        </div>
        <div class="ax-resend" id="switchBlock" hidden>
          <button type="button" class="ax-link-btn" id="switchBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21l1.7-5A8.5 8.5 0 1 1 8 19.4L3 21z"/></svg> Recevoir le code sur WhatsApp</button>
        </div>
        <div class="ax-resend" id="recoveryToggleBlock" hidden>
          <button type="button" class="ax-link-btn" id="recoveryToggle">Utiliser un code de secours</button>
        </div>
        <p class="ax-help" id="help"></p>
        <a class="ax-back" href="/app/login">Revenir à la connexion</a>
      </section>
    </main>

    <footer class="ax-footer">
      <span>© TRAXO</span>
      <nav aria-label="Liens utiles"><a href="/confidentialite">Confidentialité</a><a href="/conditions">Conditions</a><a href="mailto:support@gettraxo.app" data-support>Besoin d’aide ?</a></nav>
    </footer>

    <script src="/loaders.js"></script>
    <script src="/auth.js"></script>
    <script>
      (function () {
        var params = new URLSearchParams(location.search);
        var isTotp = location.pathname === '/app/login/2fa';
        var form = document.getElementById('codeForm');
        var hidden = document.getElementById('codeValue');
        var otpRoot = document.getElementById('otp');
        var submit = form.querySelector('.ax-submit');
        var recoveryWrap = document.getElementById('recoveryWrap');
        var recoveryInput = document.getElementById('recoveryInput');
        var useRecovery = false;

        var otp = TraxoAuth.mountOtp(otpRoot, hidden, function () {
          // Code complet : envoi automatique (une seule fois).
          if (form.dataset.sending !== '1') { form.requestSubmit ? form.requestSubmit() : form.submit(); }
        });

        var left = Number(params.get('left'));
        if (params.get('error') === 'code') {
          TraxoAuth.showBanner('Code incorrect.' + (left >= 0 && left < 5 ? ' Encore ' + left + ' essai' + (left > 1 ? 's' : '') + '.' : ''), 'error');
          otpRoot.classList.add('has-error');
        }

        form.addEventListener('submit', function (event) {
          if (useRecovery) hidden.value = recoveryInput.value.trim();
          var ok = useRecovery ? /^[0-9A-Za-z]{4}-?[0-9A-Za-z]{4}$/.test(hidden.value) : /^\d{6}$/.test(hidden.value);
          if (!ok) {
            event.preventDefault();
            event.stopImmediatePropagation();
            TraxoAuth.showBanner(useRecovery ? 'Un code de secours a le format ABCD-EFGH.' : 'Saisissez les 6 chiffres du code.', 'error');
            if (useRecovery) recoveryInput.focus(); else otp.focus();
          }
        }, true);

        if (isTotp) {
          form.action = '/app/login/2fa';
          form.dataset.loader = 'truck';
          form.dataset.loaderMessage = 'Connexion en cours…';
          document.title = 'Vérification en deux étapes — TRAXO';
          document.getElementById('title').textContent = 'Vérification en deux étapes';
          document.getElementById('subtitle').textContent = 'Ouvrez votre application d’authentification et saisissez le code à 6 chiffres affiché pour TRAXO.';
          document.getElementById('target').hidden = true;
          document.getElementById('recoveryToggleBlock').hidden = false;
          document.getElementById('help').textContent = 'Le code change toutes les 30 secondes. Téléphone perdu ? Utilisez l’un des codes de secours reçus lors de l’activation.';
          document.getElementById('recoveryToggle').addEventListener('click', function () {
            useRecovery = !useRecovery;
            otpRoot.hidden = useRecovery;
            recoveryWrap.hidden = !useRecovery;
            this.textContent = useRecovery ? 'Utiliser le code de l’application' : 'Utiliser un code de secours';
            (useRecovery ? recoveryInput : otpRoot.querySelector('input')).focus();
          });
          otp.focus();
          return;
        }

        // Code envoyé par e-mail (ou WhatsApp si le numéro est connu)
        var resendBlock = document.getElementById('resendBlock');
        var resendBtn = document.getElementById('resendBtn');
        var resendWait = document.getElementById('resendWait');
        var timerEl = document.getElementById('timer');
        var switchBlock = document.getElementById('switchBlock');
        var switchBtn = document.getElementById('switchBtn');
        var tick = null;
        var info = null;
        function countdown(seconds) {
          clearInterval(tick);
          resendBlock.hidden = false;
          if (seconds == null) { resendWait.hidden = false; resendWait.textContent = 'Nombre maximal d’envois atteint pour ce code.'; resendBtn.disabled = true; return; }
          var remaining = seconds;
          function paint() {
            timerEl.textContent = Math.floor(remaining / 60) + ':' + String(remaining % 60).padStart(2, '0');
            resendWait.hidden = remaining <= 0;
            resendBtn.disabled = remaining > 0;
          }
          paint();
          tick = setInterval(function () { remaining -= 1; paint(); if (remaining <= 0) clearInterval(tick); }, 1000);
        }
        var chooser = document.getElementById('chooser');
        function describe() {
          var pending = info.channel === 'pending';
          chooser.hidden = !pending;
          form.hidden = pending;
          if (pending) {
            resendBlock.hidden = true;
            switchBlock.hidden = true;
            document.title = 'Recevoir votre code — TRAXO';
            document.getElementById('title').textContent = 'Où recevoir votre code ?';
            document.getElementById('subtitle').textContent = 'Pour sécuriser votre connexion, choisissez où recevoir votre code à 6 chiffres.';
            document.getElementById('target').textContent = '';
            document.getElementById('chooseEmail').textContent = info.email;
            document.getElementById('chooseWa').textContent = info.whatsapp || '';
            chooser.querySelector('[data-channel="whatsapp"]').hidden = !info.whatsapp;
            document.getElementById('help').textContent = 'Pour ne plus avoir de code sur cet appareil, cochez « Rester connecté pendant 30 jours » à la connexion.';
            return;
          }
          var signup = info.purpose === 'signup';
          form.dataset.loader = signup ? 'speeder' : 'truck';
          form.dataset.loaderMessage = signup ? 'Nous ouvrons votre nouvel espace…' : 'Connexion en cours…';
          var onWhatsApp = info.channel === 'whatsapp';
          document.title = (signup ? 'Confirmez votre adresse' : 'Code de connexion') + ' — TRAXO';
          document.getElementById('title').textContent = signup ? 'Confirmez votre adresse e‑mail' : 'Confirmez qu’il s’agit bien de vous';
          document.getElementById('subtitle').textContent = onWhatsApp
            ? 'Nous avons envoyé un code à 6 chiffres sur WhatsApp au'
            : (signup ? 'Nous venons d’envoyer un code à 6 chiffres à' : 'Pour sécuriser votre connexion, nous avons envoyé un code à 6 chiffres à');
          document.getElementById('target').textContent = onWhatsApp ? info.whatsapp : info.email;
          document.getElementById('help').textContent = onWhatsApp
            ? 'Le code est valable 10 minutes. Il arrive dans une conversation avec le numéro TRAXO.'
            : 'Le code est valable 10 minutes. Vous ne trouvez pas l’e‑mail ? Regardez dans les courriers indésirables.';
          switchBlock.hidden = !info.whatsapp;
          switchBtn.lastChild.textContent = onWhatsApp ? ' Recevoir plutôt par e‑mail' : ' Recevoir le code sur WhatsApp';
        }
        fetch('/app/login/code/state', { credentials: 'same-origin' }).then(function (r) {
          if (r.status === 410) { location.replace('/app/login?error=expired'); return null; }
          return r.json();
        }).then(function (state) {
          if (!state) return;
          info = state;
          describe();
          if (state.channel !== 'pending') countdown(state.resendIn);
          else chooser.querySelector('.ax-choice').focus();
        }).catch(function () {});

        function send(channel, button) {
          button.disabled = true;
          fetch('/app/login/code/resend', { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ channel: channel }) }).then(function (r) {
            return r.json().then(function (data) { return { ok: r.ok, status: r.status, data: data }; });
          }).then(function (res) {
            button.disabled = false;
            if (res.status === 410) { location.replace('/app/login?error=expired'); return; }
            if (!res.ok) { TraxoAuth.showBanner(res.data.error || 'Le code n’a pas pu être renvoyé.', 'error'); if (res.data.resendIn !== undefined) countdown(res.data.resendIn); return; }
            info.channel = res.data.channel || channel;
            describe();
            TraxoAuth.showBanner(info.channel === 'whatsapp' ? 'Code envoyé sur WhatsApp. L’ancien ne fonctionne plus.' : 'Nouveau code envoyé par e‑mail. L’ancien ne fonctionne plus.', 'success');
            otpRoot.classList.remove('has-error');
            countdown(res.data.resendIn);
            otp.focus();
          }).catch(function () { button.disabled = false; TraxoAuth.showBanner('Connexion impossible. Vérifiez votre réseau puis réessayez.', 'error'); });
        }
        resendBtn.addEventListener('click', function () { send(info ? info.channel : 'email', resendBtn); });
        chooser.querySelectorAll('[data-channel]').forEach(function (b) {
          b.addEventListener('click', function () {
            chooser.querySelectorAll('button').forEach(function (x) { x.disabled = true; });
            b.classList.add('is-sending');
            send(b.dataset.channel, b);
            setTimeout(function () { chooser.querySelectorAll('button').forEach(function (x) { x.disabled = false; x.classList.remove('is-sending'); }); }, 1500);
          });
        });
        switchBtn.addEventListener('click', function () { send(info && info.channel === 'whatsapp' ? 'email' : 'whatsapp', switchBtn); });
        otp.focus();
      })();
    </script>
  </body>
</html>
