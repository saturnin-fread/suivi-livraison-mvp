<svg xmlns="http://www.w3.org/2000/svg" width="152" height="116" viewBox="0 0 152 116" fill="none" role="img" aria-label="Commandes offertes">
<style>.credit-back{transform-origin:76px 70px;animation:unfold .7s ease-out both}.credit-front{animation:arrive .6s ease-out both}.credit-check{stroke-dasharray:24;stroke-dashoffset:0;animation:check .8s ease-out both}@keyframes unfold{from{transform:rotate(-7deg) translate(8px,3px)}to{transform:none}}@keyframes arrive{from{transform:translateY(5px);opacity:0}to{transform:none;opacity:1}}@keyframes check{0%,45%{stroke-dashoffset:24}100%{stroke-dashoffset:0}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style>
