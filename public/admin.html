<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Administration — Livraisons</title>
    <style>
      body { margin: 0; background: #f4f7fb; color: #162033; font-family: Inter, system-ui, sans-serif; }
      main { max-width: 640px; margin: 40px auto; padding: 0 18px; }
      .card { background: white; border-radius: 16px; padding: 24px; box-shadow: 0 8px 28px #193b6514; }
      h1 { margin-top: 0; font-size: 24px; } label { display: block; margin: 14px 0 6px; font-size: 13px; font-weight: 700; }
      input, textarea { width: 100%; padding: 11px; border: 1px solid #ccd5e2; border-radius: 8px; font: inherit; }
      textarea { min-height: 70px; resize: vertical; } button { margin-top: 18px; padding: 12px 16px; border: 0; border-radius: 8px; background: #123b70; color: white; font-weight: 700; cursor: pointer; }
      #result, #requestResult { margin-top: 18px; padding: 12px; border-radius: 8px; background: #edf7ef; word-break: break-word; }
      hr { margin: 28px 0; border: 0; border-top: 1px solid #e6ebf2; } h2 { font-size: 18px; }
      table { width: 100%; margin-top: 14px; border-collapse: collapse; font-size: 13px; } th, td { padding: 9px 6px; border-bottom: 1px solid #e6ebf2; text-align: left; vertical-align: top; } th { color: #65738a; }
      .table-wrap { overflow-x: auto; } .status { font-weight: 700; }
    </style>
  </head>
  <body>
    <main><section class="card">
      <h1>Préparer une livraison</h1>
      <p>Commencez par envoyer un formulaire au client. Il pourra fournir sa position et ses repères avant validation.</p>
      <button type="button" id="requestLink">Générer un formulaire client</button>
      <div id="requestResult" hidden></div>
      <div class="actions"><button type="button" class="secondary" id="refreshRequests">Actualiser les demandes</button></div>
      <div class="table-wrap"><table><thead><tr><th>Client</th><th>Zone / repère</th><th>Créneau</th><th>Statut</th></tr></thead><tbody id="requests"></tbody></table></div>
      <hr />
      <h2>Commande directe — test interne</h2>
      <form id="form">
        <label>Nom du client</label><input name="customerName" required />
        <label>Téléphone du client</label><input name="customerPhone" placeholder="229XXXXXXXX" />
        <label>Adresse de livraison</label><textarea name="deliveryAddress" required></textarea>
        <label>Nom du livreur</label><input name="driverName" value="Téléphone test" />
        <label>Identifiant Traccar du livreur</label><input name="driverUniqueId" value="61779795" required />
        <button>Créer le lien de suivi</button>
      </form>
      <div id="result" hidden></div>
    </section></main>
    <script>
      const requestButton = document.getElementById('requestLink');
      const requestResult = document.getElementById('requestResult');
      requestButton.addEventListener('click', async () => {
        const response = await fetch('/api/admin/request-links', { method: 'POST' });
        const payload = await response.json();
        requestResult.hidden = false;
        requestResult.textContent = response.ok ? `Formulaire client : ${location.origin}${payload.path}` : (payload.error || 'Erreur');
      });
      async function loadRequests() {
        const response = await fetch('/api/admin/requests');
        const requests = response.ok ? await response.json() : [];
        const esc = (value) => String(value ?? '').replace(/[&<>"']/g, (character) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[character]));
        document.getElementById('requests').innerHTML = requests.map((request) => `<tr><td>${esc(request.customer_name || 'En attente')}<br><small>${esc(request.customer_phone || '')}</small></td><td>${esc(request.neighborhood || '—')}<br><small>${esc(request.landmark || '')}</small></td><td>${esc(request.requested_time || '—')}</td><td class="status">${esc(request.status)}</td></tr>`).join('') || '<tr><td colspan="4">Aucune demande pour le moment.</td></tr>';
      }
      document.getElementById('refreshRequests').addEventListener('click', loadRequests);
      loadRequests();
      const form = document.getElementById('form');
      const result = document.getElementById('result');
      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const data = Object.fromEntries(new FormData(form));
        const response = await fetch('/api/admin/orders', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
        const payload = await response.json();
        result.hidden = false;
        result.textContent = response.ok ? `Commande créée. Lien : ${location.origin}${payload.path}` : (payload.error || 'Erreur');
      });
    </script>
  </body>
</html>
